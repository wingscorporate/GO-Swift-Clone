    <script>
      // Defensive patch: Ensure window.fetch is writable with both getter and setter
      // Prevents "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      // when browser extensions or sandboxes intercept fetch.
      (function() {
        try {
          var _origFetch = (typeof window.fetch === 'function')
            ? window.fetch.bind(window)
            : window.fetch;

          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            }
          });
        } catch (e) {
          // Fallback if property definition is restricted
        }
      })();
    </script>
